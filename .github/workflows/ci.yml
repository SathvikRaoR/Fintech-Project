name: CI/CD Pipeline

on:
  push:
    branches: [ feature/*, dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  # Backend Tests and Build
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fintechdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Run unit tests
        run: mvn -B -DskipTests=false test
      
      - name: Build package
        run: mvn -q package -DskipTests
      
      - name: Generate code coverage
        run: mvn jacoco:report
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/

  # AI Service Tests
  ai-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
          pip install pytest pytest-cov
      
      - name: Train models
        run: |
          python ai-service/scripts/train_anomaly_model.py
          python ai-service/scripts/train_credit_model.py
      
      - name: Run AI service tests (placeholder)
        run: |
          # pytest ai-service/tests/ -v --cov --cov-report=xml
          echo "AI service tests would run here"

  # Docker Build
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, ai-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend image
        run: docker build -t fintech-backend:latest .
      
      - name: Build AI service image
        run: docker build -t fintech-ai-service:latest ./ai-service
      
      - name: Test backend container health
        run: |
          docker run -d --name backend-test -p 8080:8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/fintechdb \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=postgres \
            fintech-backend:latest || true
          sleep 10
          # Note: Health check would fail without DB, but we verify image builds

  # API Tests with Postman
  api-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Newman
        run: npm install -g newman
      
      - name: Run Postman collection
        run: |
          # newman run tests/postman/fintech.postman_collection.json \
          #   --environment tests/postman/fintech.postman_env.json \
          #   --reporters cli,json,html
          echo "API tests would run against running backend"
        continue-on-error: true
      
      - name: Upload Postman results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: postman-test-results
          path: newman/

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Notify on Failure
  notify-failure:
    runs-on: ubuntu-latest
    needs: [backend-tests, ai-tests, docker-build, api-tests]
    if: failure()
    
    steps:
      - name: Notify Slack on failure
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Fintech MVP CI/CD Pipeline Failed!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        if: always()
